<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgentGuard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8 font-sans">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-2">AgentGuard Gateway</h1>
        <div id="status" class="text-sm text-yellow-400 mb-6">Connecting to Gateway WS...</div>

        <div id="modal" class="hidden bg-gray-800 p-6 rounded-lg border border-red-500 mb-6 shadow-xl">
            <h2 class="text-xl font-bold text-red-400 mb-2">Security Approval Requested</h2>
            <p id="modal-action" class="text-sm text-gray-300 font-semibold mb-1"></p>
            <p id="modal-violations" class="text-xs text-red-300 mb-3"></p>

            <label class="block text-xs font-bold text-gray-400 mb-1">Flagged Code Snippet:</label>
            <pre id="modal-code" class="bg-black p-3 rounded text-green-400 text-xs mb-4 overflow-x-auto font-mono"></pre>

            <div class="flex gap-4">
                <button onclick="respond(true)" class="bg-green-600 px-4 py-2 rounded font-bold hover:bg-green-500 transition">Approve Execution</button>
                <button onclick="respond(false)" class="bg-red-600 px-4 py-2 rounded font-bold hover:bg-red-500 transition">Deny Execution</button>
            </div>
        </div>

        <div class="bg-gray-800 p-4 rounded border border-gray-700">
            <h3 class="font-semibold text-sm mb-2 text-gray-300">Activity History</h3>
            <ul id="log" class="text-xs space-y-1 text-gray-400 font-mono"></ul>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws/approval");
        let currentRequestId = null;

        ws.onopen = () => {
            document.getElementById("status").innerText = "● Gateway Live & Monitoring";
            document.getElementById("status").className = "text-sm text-green-400 mb-6";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === "PERMISSION_REQUIRED") {
                currentRequestId = msg.request_id;

                document.getElementById("modal-action").innerText = `Action: ${msg.action_name}`;
                document.getElementById("modal-violations").innerText = `Violations: ${msg.violations.join(", ")}`;
                document.getElementById("modal-code").innerText = msg.code_snippet;

                document.getElementById("modal").classList.remove("hidden");
            }
        };

        function respond(approved) {
            if (currentRequestId) {
                ws.send(JSON.stringify({
                    request_id: currentRequestId,
                    approved: approved
                }));

                document.getElementById("modal").classList.add("hidden");

                const logItem = document.createElement("li");
                const time = new Date().toLocaleTimeString();
                logItem.innerText = `[${time}] ID: ${currentRequestId} ──> ${approved ? 'APPROVED' : 'DENIED'}`;
                logItem.className = approved ? "text-green-400" : "text-red-400";
                document.getElementById("log").appendChild(logItem);

                currentRequestId = null;
            }
        }
    </script>
</body>
</html>
