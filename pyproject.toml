[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
authors = [
  { name="Alicexxxxxxxx", email="endyli3008@gmail.com" },
]
description = "A short description of AgentGuard"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Add third-party packages here, e.g. "requests>=2.28.0"
]

[project.urls]
"Homepage" = "https://github.com/alicexxxxxxxx/AgentGuard"

[tool.setuptools.packages.find]
where = ["src"]