[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
authors = [
  { name="Alicexxxxxxxx", email="endyli3008@gmail.com" },
]
description = "AgentGuard AST Security & Real-Time Authorization Gateway"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0"
]

[project.urls]
"Homepage" = "https://github.com/alicexxxxxxxx/AgentGuard"

[project.scripts]
agentguard = "agentguard.main:start"

[tool.setuptools.packages.find]
where = ["src"]